<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15171c">
  <meta name="description" content="A collection of interactive statistics tools.">
  <title>Statistics Tools</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #15171c;
      --surface: #232630;
      --surface-hover: #2b2e3a;
      --text: #f5f5f7;
      --muted: #a2a6b3;
      --line: #30343e;
      --purple: #c4b5fd;
      --pink: #f472b6;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid #e9d5ff; outline-offset: 5px; }
    .container { width: min(860px, calc(100% - 48px)); margin: 0 auto; }
    .site-header { border-bottom: 1px solid var(--line); }
    .navigation { height: 78px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 570; text-decoration: none; letter-spacing: -.025em; }
    .brand-star { color: var(--pink); font-size: 25px; line-height: 1; font-weight: 400; }
    .nav-link { color: #b9bdc8; font-size: 13px; text-decoration: none; transition: color 180ms ease; }
    .nav-link:hover { color: #fff; }
    .hero { display: flex; padding: 91px 0 87px; gap: 28px; align-items: stretch; }
    .hero-rail { width: 20px; flex: none; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .hero-rail-line { width: 2px; min-height: 108px; flex: 1; background: #a78bfa; }
    .hero-rail-number { color: #8d90a0; font-size: 10px; letter-spacing: .08em; }
    .hero-copy { padding-top: 2px; }
    .eyebrow { margin: 0 0 19px; color: #a8aab6; font-size: 11px; letter-spacing: .15em; font-weight: 570; text-transform: uppercase; }
    h1 { font-size: clamp(39px, 7vw, 68px); font-weight: 420; line-height: 1.08; letter-spacing: -.064em; margin: 0; }
    h1 .period { color: #c4b5fd; }
    .spectrum { display: flex; align-items: center; gap: 10px; padding-top: 33px; }
    .spectrum span { width: 7px; height: 7px; border-radius: 50%; display: block; }
    .spectrum span:nth-child(1) { background: #a78bfa; }
    .spectrum span:nth-child(2) { background: #f472b6; }
    .spectrum span:nth-child(3) { background: #fb923c; }
    .spectrum span:nth-child(4) { background: #facc15; }
    .spectrum span:nth-child(5) { background: #2dd4bf; }
    .spectrum span:nth-child(6) { background: #38bdf8; }
    .tools { padding-bottom: 116px; }
    .section-top { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    h2 { margin: 0; font-size: 13px; font-weight: 570; letter-spacing: .045em; text-transform: uppercase; color: #e5e5e9; }
    .count { color: #818694; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .tool-link {
      display: grid;
      grid-template-columns: 94px minmax(0,1fr) 30px;
      align-items: center;
      gap: 24px;
      min-height: 139px;
      padding: 20px 25px;
      border-radius: 15px;
      background: var(--surface);
      text-decoration: none;
      transition: background 180ms ease, transform 180ms ease;
    }
    .tool-link:hover { background: var(--surface-hover); transform: translateY(-2px); }
    .tool-art { width: 94px; height: 88px; background: #343045; border-radius: 11px; display: grid; place-items: center; padding: 12px; }
    .tool-art svg { width: 100%; height: auto; }
    .tool-category { margin: 0 0 5px; color: var(--purple); font-size: 10px; font-weight: 600; letter-spacing: .105em; text-transform: uppercase; }
    .tool-title { margin: 0 0 4px; font-size: 19px; font-weight: 530; line-height: 1.33; letter-spacing: -.025em; }
    .tool-description { margin: 0; color: #afb3c0; font-size: 13px; }
    .tool-arrow { width: 29px; height: 29px; display: grid; place-items: center; color: #c4b5fd; border-radius: 50%; transition: transform 180ms ease; }
    .tool-link:hover .tool-arrow { transform: translate(2px,-2px); }
    .footer { border-top: 1px solid var(--line); padding: 25px 0 31px; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .footer-name { color: #858a98; font-size: 12px; }
    .footer-spectrum { display: flex; gap: 5px; }
    .footer-spectrum i { display: block; height: 3px; width: 16px; border-radius: 99px; }
    .footer-spectrum i:nth-child(1) { background: #a78bfa; }
    .footer-spectrum i:nth-child(2) { background: #f472b6; }
    .footer-spectrum i:nth-child(3) { background: #fb923c; }
    .footer-spectrum i:nth-child(4) { background: #facc15; }
    .footer-spectrum i:nth-child(5) { background: #2dd4bf; }
    .footer-spectrum i:nth-child(6) { background: #38bdf8; }
    @media (max-width: 600px) {
      .container { width: min(100% - 34px, 860px); }
      .navigation { height: 67px; }
      .hero { padding: 69px 0 70px; gap: 18px; }
      .hero-rail { width: 14px; }
      .hero-rail-line { min-height: 90px; }
      h1 { font-size: clamp(38px, 10vw, 54px); }
      .spectrum { padding-top: 28px; }
      .tools { padding-bottom: 90px; }
      .tool-link { padding: 17px; grid-template-columns: 78px minmax(0,1fr) 20px; min-height: 115px; gap: 13px; border-radius: 12px; }
      .tool-art { width: 78px; height: 76px; padding: 9px; }
      .tool-title { font-size: 16px; }
      .tool-description { font-size: 12px; }
      .tool-category { font-size: 9px; }
      .tool-arrow { width: 20px; }
    }
    @media (max-width: 390px) {
      .hero { gap: 13px; }
      .tool-link { grid-template-columns: 64px minmax(0,1fr) 15px; gap: 10px; padding: 12px; }
      .tool-art { width: 64px; height: 69px; }
      .tool-title { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="container navigation" aria-label="Main navigation">
      <a href="./" class="brand" aria-label="Statistics Tools homepage"><span class="brand-star" aria-hidden="true">✳</span><span>Statistics Tools</span></a>
      <a class="nav-link" href="#tools">Explore</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-rail" aria-hidden="true"><span class="hero-rail-line"></span><span class="hero-rail-number">01</span></div>
      <div class="hero-copy">
        <p class="eyebrow">An interactive collection</p>
        <h1 id="page-title">Statistics Tools<span class="period">.</span></h1>
        <div class="spectrum" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </section>

    <section class="tools" id="tools" aria-labelledby="tools-title">
      <div class="section-top">
        <h2 id="tools-title">Interactives</h2>
        <span class="count">01 available</span>
      </div>
      <!-- To add another tool later, duplicate the tool-link element and change its URL, title, description, and topic color. -->
      <a class="tool-link" href="./normal-curve/" aria-label="Open CI Normal Curve Explorer">
        <span class="tool-art" aria-hidden="true">
          <svg viewBox="0 0 100 76" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 60H96" stroke="#8d849c" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4 60C24 60 33 52 40 29C43.6 17.2 46.8 11 50 11C53.2 11 56.4 17.2 60 29C67 52 76 60 96 60" stroke="#ded1ff" stroke-width="2.7" stroke-linecap="round"/>
            <path d="M25 60C34 49 41 11 50 11C59 11 66 49 75 60Z" fill="#a78bfa" fill-opacity="0.42"/>
            <path d="M25 60V49M75 60V49" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="2.5 3"/>
            <circle cx="25" cy="60" r="3.4" fill="#f9a8d4"/>
            <circle cx="75" cy="60" r="3.4" fill="#f9a8d4"/>
          </svg>
        </span>
        <div>
          <p class="tool-category">Confidence intervals</p>
          <h3 class="tool-title">CI Normal Curve Explorer</h3>
          <p class="tool-description">Explore confidence levels and critical values.</p>
        </div>
        <span class="tool-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
        </span>
      </a>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-name">Statistics Tools</span>
      <span class="footer-spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </footer>
</body>
</html>
