<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calculus Unfolded — The Algebra</title><style>
:root{color-scheme:light;--bg:#f6f5fb;--paper:#fff;--text:#1c2232;--muted:#5f6880;--line:#dedfeb;--purple:#8b46ce;--blue:#167caf;--pink:#c74787;--teal:#147e71;--gold:#ac7009;--soft:#f2edfc}body.dark{color-scheme:dark;--bg:#111523;--paper:#1a2031;--text:#f0f2fb;--muted:#b9c3d7;--line:#3b455a;--soft:#29253f;--purple:#c99afc;--blue:#6dcafa;--pink:#f69ac7;--teal:#70ddc2;--gold:#f7c66a}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:16px/1.47 system-ui,-apple-system,Arial,sans-serif;margin:0}.wrap{max-width:600px;padding:14px 13px 46px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;line-height:1.1;margin:7px 0 5px;letter-spacing:-.7px}p{margin:4px 0 10px;color:var(--muted)}.tag{font-size:11px;letter-spacing:.13em;font-weight:850;color:var(--purple)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}.theme{border:1px solid var(--line);color:var(--text);background:var(--paper);border-radius:30px;padding:9px 12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:16px 0 12px;padding:4px;border-radius:13px;background:var(--soft)}.tab{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:10px 3px;font-weight:750;font-size:13px}.tab[aria-selected=true]{background:var(--paper);color:var(--purple);box-shadow:0 2px 9px #0002}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.headline{display:flex;align-items:center;justify-content:space-between;gap:8px}.headline h2{font-size:18px;margin:0}.subtitle{font-size:13px;color:var(--muted)}.math{font-family:Cambria,'Times New Roman',serif;font-size:25px;line-height:1.65;overflow-wrap:anywhere;text-align:center;color:var(--text);padding:7px 0}.math.small{font-size:21px}.math .u,.u{color:var(--pink)}.math .d,.d{color:var(--blue)}.math .a,.a{color:var(--teal)}.math .c,.c{color:var(--gold)}.math .p,.p{color:var(--purple)}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.14;font-size:.82em;margin:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:1px 4px}.frac>span:last-child{padding:2px 4px}.integral{font-size:1.55em;vertical-align:-.14em}.limits{display:inline-flex;flex-direction:column;font-size:.53em;vertical-align:middle;line-height:1.1;margin-left:-4px;margin-right:5px}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 11px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:currentColor;margin-right:4px}.step{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:7px 0;color:var(--text)}.step.open{border-color:var(--purple);background:var(--soft)}.steptop{display:flex;gap:9px;align-items:center}.num{background:var(--soft);color:var(--purple);border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-weight:850;font-size:12px;flex-shrink:0}.step.open .num{background:var(--purple);color:var(--bg)}.label{font-size:13px;font-weight:780;flex:1}.chevron{font-weight:800;color:var(--muted)}.work{font-size:21px;font-family:Cambria,'Times New Roman',serif;text-align:center;margin:10px 0 4px;line-height:1.6;overflow-wrap:anywhere}.why{font-size:13px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.controls{display:flex;gap:8px;margin:10px 0}.primary{background:var(--purple);color:var(--bg);border:none;border-radius:12px;padding:12px 16px;font-weight:800;flex:1}.secondary{background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.mini{padding:10px 11px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.55}.mini strong{color:var(--text)}.number{color:var(--purple);font-weight:800}.sliderrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--purple);height:32px}.diagram{width:100%;height:auto;display:block}.diagram text{font:12px system-ui;fill:var(--muted)}.hint{font-size:12px;color:var(--muted)}.footer{font-size:12px;text-align:center;color:var(--muted);padding:12px}.result{border-left:4px solid var(--teal);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px}.result .math{font-size:23px}@media(max-width:370px){.math{font-size:22px}.work{font-size:19px}.wrap{padding-inline:10px}}

/* animated algebra microscope */
.microscope{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:14px;margin:10px 0;overflow:hidden}
.microlabel{font-size:11px;letter-spacing:.12em;font-weight:850;color:var(--purple);margin-bottom:5px}
.equation-stage{min-height:90px;display:grid;align-items:center;position:relative}
.equation-stage .work{font-size:clamp(21px,5vw,28px);margin:7px 0;animation:equationEnter .42s cubic-bezier(.18,.9,.3,1) both}
@keyframes equationEnter{from{opacity:0;transform:translateY(14px) scale(.97);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.minirow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.minirow button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:9px 12px;color:var(--text);font-weight:700;font-size:13px}
.minirow button.active{background:var(--purple);color:var(--bg)}
.deep{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.deep h3{font-size:13px;margin:9px 0 5px;color:var(--text)}
.deep p{font-size:13px;line-height:1.55;margin:4px 0 10px}
.derive{font:20px/1.7 Cambria,'Times New Roman',serif;overflow-wrap:anywhere;border-radius:10px;background:var(--soft);padding:10px;text-align:center;margin:8px 0}
.workline{width:100%;border:1px solid var(--line);border-radius:12px;text-align:left;background:var(--paper);color:var(--text);padding:11px 12px;margin:5px 0}
.workline.selected{border-color:var(--purple);background:var(--soft)}
.workline .n{font-weight:800;color:var(--purple);font-size:12px;margin-right:8px}
.reveal-label{font-weight:750;font-size:12px;color:var(--purple)}
@media(prefers-reduced-motion:reduce){.equation-stage .work{animation:none}}
</style></head><body><main class="wrap"><header class="top"><div><div class="tag">TAP-THROUGH MATH LAB</div><h1>Calculus, Unfolded.</h1><p class="subtitle">Watch each algebra move happen. Tap for the gory details.</p></div><button class="theme" id="theme" type="button">☾ Theme</button></header><nav class="tabs" aria-label="Choose example"><button type="button" class="tab" data-mode="ftc" aria-selected="true">FTC · Area</button><button type="button" class="tab" data-mode="chain" aria-selected="false">FTC · Derivative</button><button type="button" class="tab" data-mode="sub" aria-selected="false">u-Sub</button></nav><section id="root" aria-live="polite"></section><div class="footer">Pink = inside/substitution · Blue = derivative · Teal = result. Tap a step to see its algebra and explanation.</div></main><script>
'use strict';let mode='ftc',b=4,openSteps=new Set([0]),focused=0,detail='algebra';const root=document.querySelector('#root');const theme=document.querySelector('#theme');theme.addEventListener('click',()=>{document.body.classList.toggle('dark');theme.textContent=document.body.classList.contains('dark')?'☀ Theme':'☾ Theme'});document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;openSteps=new Set([0]);focused=0;detail='algebra';document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t===btn)));render()}));const F=x=>x*x*x/3+2*x;const round=x=>Number(x.toFixed(3));function math(s,small=false){return `<div class="math${small?' small':''}">${s}</div>`}function card(title,question,legend=''){return `<section class="panel"><div class="headline"><h2>${title}</h2><span class="subtitle">Choose a line ↓</span></div>${math(question)}${legend?`<div class="legend">${legend}</div>`:''}</section>`}function detailData(){
 if(mode==='ftc')return [
  {algebra:`Use the reverse power rule: x² → x³/3, and 2 → 2x. Differentiate to check: d(x³/3 + 2x)/dx = x² + 2.`,math:`∫ x² dx = x³/3;  ∫ 2 dx = 2x`,real:`Imagine a tank filling at x² + 2 liters/minute. We need a running total, not the rate at one instant.`},
  {algebra:`Use brackets: [F(x)]₀ᵇ = F(b) − F(0). The minus sign acts on the ENTIRE lower expression.`,math:`F(${b}) − F(0)`,real:`Just like an odometer: distance traveled = ending reading − starting reading.`},
  {algebra:`Cube ${b} first (${b}³ = ${b**3}); then divide by 3. Also 2·${b} = ${2*b}. Finally subtract the lower-end value (zero).`,math:`${b**3}/3 + ${2*b} − 0 = ${round(F(b))}`,real:`You're adding up all the tiny amounts of water that entered during ${b} minutes.`},
  {algebra:`A rate has units liters/minute. Multiplying a thin slice by its width in minutes leaves liters. Integrating adds all slices.`,math:`(liters/min) × min = liters`,real:`${round(F(b))} liters is the total amount added, not the flow rate at minute ${b}.`}
 ];
 if(mode==='chain')return [
  {algebra:`The letter t is a dummy integration variable. The upper boundary x² is not t: it depends on x.`,math:`f(t) = 3t² + 1; g(x) = x²`,real:`Imagine water accumulated up to a moving time limit. The amount collected changes because the time limit moves.`},
  {algebra:`First FTC: rate of accumulated area at the boundary is f(g(x)). Then chain rule: multiply by how fast the boundary moves, g′(x).`,math:`A′(x) = f(g(x))·g′(x)`,real:`If the finish line moves twice as fast, accumulated area can change twice as fast too.`},
  {algebra:`Every t in the integrand gets replaced by (x²). Keep parentheses: 3(x²)² + 1. Separately g′(x)=2x.`,math:`[3(x²)² + 1](2x)`,real:`Check both pieces: what is the rate at the new boundary, and how fast is that boundary moving?`},
  {algebra:`(x²)² = x⁴ because exponents multiply. Then distribute: 2x·3x⁴ = 6x⁵ and 2x·1 = 2x.`,math:`2x(3x⁴ + 1) = 6x⁵ + 2x`,real:`The final expression is the instantaneous rate at which the accumulated total is changing.`}
 ];
 return [
  {algebra:`The outer operation is raising something to the fourth power. Everything inside (x²+3) becomes u.`,math:`u = x² + 3`,real:`Think of giving a complicated repeated ingredient a short nickname.`},
  {algebra:`Differentiate both sides: d(x² + 3) = 2x dx. The dx travels with the derivative; it isn't a free decoration.`,math:`du/dx = 2x  ⇒  du = 2x dx`,real:`The matching 2x is the chain-rule adjustment that makes the substitution work.`},
  {algebra:`Replace both matching chunks at once: (x²+3)⁴ → u⁴ and 2x dx → du. There must be no stray x.`,math:`∫ 2x(x²+3)⁴ dx → ∫ u⁴ du`,real:`Instead of expanding a gigantic expression, we turn it into a familiar power rule.`},
  {algebra:`Increase exponent 4 by 1 to get 5 and divide by 5. This is an indefinite integral, so include + C.`,math:`∫ u⁴ du = u⁵/5 + C`,real:`You're undoing differentiation: the derivative of u⁵/5 is u⁴.`},
  {algebra:`Replace u using its definition. Differentiate the answer to verify: (1/5)·5(x²+3)⁴·2x equals the original integrand.`,math:`(x²+3)⁵/5 + C`,real:`The final answer must be written in the original variable x.`}
 ];
}
function microscope(items){const i=Math.max(0,Math.min(focused,items.length-1)), info=detailData()[i];return `<section class="microscope"><div class="microlabel">ALGEBRA MICROSCOPE · ${i+1} / ${items.length}</div><div class="equation-stage" aria-live="polite"><div class="work" key="${mode}-${i}">${items[i].work}</div></div><div class="minirow"><button type="button" id="prevFocus" ${i===0?'disabled':''}>← Back</button><button type="button" class="active" id="nextFocus">${i===items.length-1?'Replay ↺':'Animate next →'}</button></div><div class="deep"><div class="minirow" role="group" aria-label="Explanation type"><button type="button" data-detail="algebra" class="${detail==='algebra'?'active':''}">🔍 Algebra</button><button type="button" data-detail="math" class="${detail==='math'?'active':''}">∑ Details</button><button type="button" data-detail="real" class="${detail==='real'?'active':''}">🌎 Real life</button></div><div id="deepBody" aria-live="polite">${detail==='math'?`<div class="derive">${info.math}</div>`:`<p>${detail==='algebra'?info.algebra:info.real}</p>`}</div></div></section>`}
function stepHTML(items){return `${microscope(items)}<section class="panel"><div class="microlabel">TAP ANY LINE TO JUMP THERE</div>${items.map((s,i)=>`<button type="button" data-focus="${i}" class="workline ${focused===i?'selected':''}"><span class="n">${i+1}</span>${s.name} ${focused===i?'· viewing':''}</button>`).join('')}</section>`}
function render(){let html='',items=[];if(mode==='ftc'){let val=round(F(b));html=card('From area to an exact number',`<span class="integral">∫</span><span class="limits"><span class="c">${b}</span><span>0</span></span>(<span class="p">x² + 2</span>) dx`,'<span class="p">■</span> Function <span class="c">■</span> Upper limit <span class="a">■</span> Area');html+=`<section class="panel"><div class="sliderrow"><strong>Drag the upper limit</strong><strong class="number">b = ${b}</strong></div><input id="bound" type="range" min="1" max="6" step="1" value="${b}" aria-label="Upper bound"><svg class="diagram" viewBox="0 0 340 150" role="img" aria-label="Graph of x squared plus two, with shaded area from zero to ${b}"><line x1="29" y1="124" x2="324" y2="124" stroke="currentColor" opacity=".3"/><line x1="29" y1="10" x2="29" y2="124" stroke="currentColor" opacity=".3"/><path d="${areaPath(b)}" fill="var(--teal)" opacity=".20"/><path d="${curvePath()}" fill="none" stroke="var(--purple)" stroke-width="3"/><line x1="${gx(b)}" x2="${gx(b)}" y1="${gy(b*b+2)}" y2="124" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3"/><text x="27" y="140">0</text><text x="${gx(b)-8}" y="140" fill="var(--gold)">${b}</text><text x="243" y="18">f(x) = x² + 2</text></svg><div class="mini"><strong>Real-life meaning:</strong> If <span class="p">x² + 2</span> is a water-flow rate in liters/minute, the shaded area is <span class="a">${val} liters</span> added over ${b} minutes.</div></section>`;items=[{name:'Find an antiderivative',work:`<span class="p">F(x)</span> = <span class="frac"><span>x³</span><span>3</span></span> + 2x`,why:'Integrate term by term. The power rule increases the exponent by 1, then divides by the new exponent. Since d(x³/3)/dx = x², this reverses differentiation.'},{name:'Apply the Fundamental Theorem',work:`[<span class="p">F(x)</span>]<span style="font-size:14px;vertical-align:super">${b}</span><span style="font-size:14px;vertical-align:sub">0</span> = <span class="p">F(${b})</span> − <span class="p">F(0)</span>`,why:'The exact accumulated change is the antiderivative at the upper limit minus its value at the lower limit. Always substitute both limits.'},{name:'Substitute and simplify',work:`(<span class="frac"><span>${b}³</span><span>3</span></span> + 2(${b})) − (<span class="frac"><span>0³</span><span>3</span></span> + 0)`,why:`First evaluate the upper expression: ${b}³ = ${b**3} and 2(${b}) = ${2*b}. Then evaluate the lower expression: both terms are 0.`},{name:'Interpret the answer',work:`<span class="a">${val} liters</span>`,why:'The area under a rate-versus-time graph gives the total amount accumulated. Rate (liters/minute) × time (minutes) = liters.'}]}else if(mode==='chain'){html=card('Differentiate an accumulation function',`<span class="a">A(x)</span> = <span class="integral">∫</span><span class="limits"><span class="u">x²</span><span>1</span></span>(<span class="p">3t² + 1</span>) dt`,'<span class="p">■</span> Integrand <span class="u">■</span> Moving upper limit <span class="d">■</span> Chain rule');html+=`<section class="panel"><div class="mini"><strong>Think of it this way:</strong> You are measuring the amount collected up to a changing endpoint. Because the endpoint is <span class="u">x²</span>, it may move faster or slower than x itself. The derivative must account for that speed.</div></section>`;items=[{name:'Identify the two layers',work:`<span class="p">f(t)</span> = 3t² + 1<br><span class="u">g(x)</span> = x²`,why:'The integral accumulates f(t), but stops at the variable endpoint g(x). The letter t is a placeholder inside the integral.'},{name:'Apply FTC Part 1',work:`<span class="a">A′(x)</span> = <span class="p">f(<span class="u">g(x)</span>)</span> · <span class="d">g′(x)</span>`,why:'For a constant lower limit, the derivative of the accumulated area is the integrand evaluated at the upper endpoint, multiplied by the derivative of that endpoint.'},{name:'Substitute the endpoint',work:`<span class="a">A′(x)</span> = [3(<span class="u">x²</span>)² + 1] · <span class="d">2x</span>`,why:'Replace every t in 3t²+1 with the entire expression x². Separately differentiate x² to obtain 2x.'},{name:'Simplify the algebra',work:`(3x⁴ + 1)(2x) = <span class="a">6x⁵ + 2x</span>`,why:'First, (x²)² = x⁴. Then distribute 2x across the parentheses: 2x·3x⁴ = 6x⁵ and 2x·1 = 2x.'}]}else{html=card('Transform the integral',`<span class="integral">∫</span><span class="d">2x</span>(<span class="u">x² + 3</span>)⁴ dx`,'<span class="u">■</span> Inside function u <span class="d">■</span> Matching derivative du <span class="a">■</span> Result');html+=`<section class="panel"><div class="mini"><strong>The big idea:</strong> Substitution is the chain rule in reverse. Instead of expanding a huge power, replace the inside expression with one simple variable.</div></section>`;items=[{name:'Choose the inside expression',work:`<span class="u">u = x² + 3</span>`,why:'The fourth power is applied to the entire inside expression. Naming that expression u turns a complicated composite function into a simple power.'},{name:'Differentiate u',work:`<span class="d">du = 2x dx</span>`,why:'The derivative of x² + 3 is 2x. The original integral contains exactly 2x dx, so that factor can be replaced by du.'},{name:'Rewrite the integral',work:`<span class="integral">∫</span><span class="u">u⁴</span> <span class="d">du</span>`,why:'Replace (x²+3)⁴ with u⁴ and 2x dx with du. No x remains: the entire integral is expressed in u.'},{name:'Integrate in u',work:`<span class="frac"><span>u⁵</span><span>5</span></span> + C`,why:'Apply the power rule: raise the exponent 4 to 5, then divide by 5. Keep the constant of integration.'},{name:'Replace u with x',work:`<span class="a"><span class="frac"><span>(x² + 3)⁵</span><span>5</span></span> + C</span>`,why:'Put the original expression back in place of u. Check: differentiating this answer with the chain rule gives 2x(x²+3)⁴.'}]};html+=stepHTML(items);html+=`<div class="result"><strong>Big idea</strong><div class="subtitle">${mode==='ftc'?'An integral of a rate measures accumulated change.':mode==='chain'?'FTC tells you the integrand; the chain rule handles a moving endpoint.':'Substitution undoes the chain rule without expanding the expression.'}</div></div>`;root.innerHTML=html;
 const focus=i=>{focused=Math.max(0,Math.min(items.length-1,i));render()};
 root.querySelectorAll('[data-focus]').forEach(btn=>btn.addEventListener('click',()=>focus(Number(btn.dataset.focus))));
 document.querySelector('#prevFocus').addEventListener('click',()=>focus(focused-1));
 document.querySelector('#nextFocus').addEventListener('click',()=>focus(focused===items.length-1?0:focused+1));
 root.querySelectorAll('[data-detail]').forEach(btn=>btn.addEventListener('click',()=>{detail=btn.dataset.detail;render()}));
 const slider=document.querySelector('#bound');if(slider)slider.addEventListener('input',()=>{b=Number(slider.value);render()})}
const gx=x=>29+x/6*290,gy=y=>124-y/39*109;function curvePath(){let d='';for(let x=0;x<=6.001;x+=.075)d+=(d?'L':'M')+gx(x).toFixed(2)+','+gy(x*x+2).toFixed(2)+' ';return d}function areaPath(top){let d=`M${gx(0)},124 `;for(let x=0;x<top;x+=.08)d+=`L${gx(x).toFixed(2)},${gy(x*x+2).toFixed(2)} `;return d+`L${gx(top)},${gy(top*top+2)} L${gx(top)},124 Z`}render();
</script></body></html>
